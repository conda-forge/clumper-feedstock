{% set name = "clumper" %}
{% set version = "0.2.15" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/clumper-{{ version }}.tar.gz
  sha256: 5b243bc1eb666447dcdf32ac3239e5133b577f58c87ddb3b4cfb4a208b24ee2c

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  imports:
    - clumper
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/clumper/
  summary: A small python library that can clump lists of data together.
  license: MIT
  # License file manually packaged. See https://github.com/koaning/clumper/pull/59
  license_file: LICENSE
  dev_url: https://github.com/koaning/clumper
  doc_url: https://koaning.github.io/clumper

extra:
  recipe-maintainers:
    - raybellwaves
